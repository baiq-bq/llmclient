name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: llmclient-npm-release
  queue: max

jobs:
  package:
    if: github.repository == 'baiq-bq/llmclient'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the release belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ci
      - name: Validate version and pack public package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/npm-release.mjs "$RELEASE_TAG" "$PRERELEASE" "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Publish the verified tarball
        working-directory: ${{ runner.temp }}/npm-release
        run: |
          read -r dist_tag < release.txt
          case "$dist_tag" in
            latest|next) ;;
            *) exit 1 ;;
          esac
          npm publish ./llmclient.tgz --ignore-scripts --registry=https://registry.npmjs.org/ --access public --tag "$dist_tag"
      - name: Wait for the public registry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..60}; do
            if [[ "$(npm view "@baiq-bq/llmclient@$version" version --prefer-online --registry=https://registry.npmjs.org/ 2>/dev/null)" == "$version" ]]; then
              echo "@baiq-bq/llmclient@$version is available on npm."
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm accepted the upload but the version is not publicly visible. Check the Versions tab before attempting another publish."
          exit 1
